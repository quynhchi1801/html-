<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = prompt("Nhập số phần từ trong mảng: ");
        let a = [];
        let kq = 0;
        for (let i = 0; i < n; i++){
            let x = prompt("Nhập số: ");
            x = Number(x);
            a.push(x)
        }
        for (let i = 0; i < n; i++){
            kq += a[i];
        }
        kq = kq / n
        console.log(a)
        console.log(kq)
    </script>
</body>
</html>
