<body>
    <script>
        function uoc_chung_ln(a,b){
            max = 0
            for (i = 1; i <= a&&b; i++){
                if ((a % i == 0) && (b % i == 0)){
                    if (max < tong_chu_so(i)){
                        max = tong_chu_so(i)
                    }
                }
            }
            return max
        }
        function tong_chu_so(n){
            let kq = 0;
            while (n>0){
                kq = kq + n%10;
                n = parseInt(n / 10)
            }
            return kq
        }
        console.log(tong_chu_so(55))
    </script>
</body>
