<body>
    <script>
        function so_chinh_phuong(n){
            let a = Math.sqrt(n);
            a = parseInt(a)
            if (a * a == n) {
                return true
            }
            else{
                return false
            }
        }
        console.log(so_chinh_phuong(4))
    </script>
</body>
