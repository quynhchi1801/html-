<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-color: black;
            width:1000px;
            height:700px;
            position:relative;
        }
        body ul {
            display:block;
            width:550px;
            height:65px;
            background-color:#498B02;
            position:absolute;
            top:350px;
            left:500px;

        }
        body ul li {
            display:inline-block;
            padding:14px 0px;
            text-align: left;
        }
        body ul li button  {
            background-color: #498B02;
            border:0px black solid;
            margin: 0px 10px;
        }
        body ul li button .fas {
            color:white;
        }
    </style>
</head>
<body>
    <ul>
        <li><button><i class="fas fa-home fa-2x"></i></button></li>
        <li><button><i class="fas fa-search fa-2x"></i></button></li>
        <li><button><i class="fas fa-envelope fa-2x"></i></button></li>
        <li><button><i class="fas fa-globe fa-2x"></i></button></li>
        <li><button><i class="fas fa-cog fa-2x fa-spin"></i></button></li>
        <li><button><i class="fas fa-user fa-2x"></i></button></li>
    </ul>
</body>
</html>
