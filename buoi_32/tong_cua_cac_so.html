<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x = 10;
        let s = 0;
        let i = 1;
        // Trong khi s mà nhỏ hơn x
        while (s < x){
            // s bằng s + i
            s = s + i;
            // i bằng i + 1
            i = i + 1
        }
        // Nếu s bằng x
        if (s == x){
            // In Yes
            console.log("Yes")
        }
        // Nếu không
        else{
            // In ra No
            console.log("No")
        }
    </script>
</body>
</html>
