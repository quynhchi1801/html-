<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 2;
        let b = 4;
        let c = 20;
        for (x = 1, x <= 20, x++){
            y = (c - a * x)/b;
            y = int(y);
        }
            if ((a*x + b*y == c) && (y>0)){
                print(x, " ", y);
            }
            
        
    </script>
</body>
</html>
