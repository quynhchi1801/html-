<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        "use strict";
        let isVietnamese = confirm("Bạn có phải là người Việt Nam không?");
        let welcome;
        if (isVietnamese) {
            welcome = function() {
                console.log("Chào bạn!");
            };
        }
        else{
            welcome = function() {
                console.log("Hello!");
            };
        }
        welcome();
    </script>
</body>
</html>
