<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = prompt("Nhập vào số n:");
        let a = [];
        let result = 0;
        for (let i = 0; i < n; i++){
            let x = prompt("Nhập các số:")
            a.push(x)
        }
        for (let i = 0; i < n; i++){
            if (a[i] % 2 != 0){
                result += parseInt(a[i])
            }
        }
        console.log(result)
    </script>
</body>
</html>
