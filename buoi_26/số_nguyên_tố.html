<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = 5;
        let result = 0;
        for (let i = 1; i <= n; i++ ){
            if (n%i==0){
                result += 1
            }
        }
        if (result == 2) {
            console.log("TRUE")
        }
        else{
            console.log("FALSE")
        }
    </script>
</body>
</html>
