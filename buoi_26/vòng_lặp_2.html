<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 2;
        let b = 3;
        let n = 10;
        let i = 1;
        let result = 1;
        while (n>0){
            if ((i%a == 0) || (i%b == 0)){
                result = i;
                n = n-1
            }
            i = i+1
        }
        console.log(result)
    </script>
</body>
