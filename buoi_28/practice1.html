<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nhap = prompt("Hãy nhập 1 số ngẫu nhiên")
        let number = Number(nhap)
        while (true){
            if (isNaN(number)) {
                alert("It's not a number");
            }
            else if (number<10){
                alert("It's too small");
            }
            else {
                break;
            }
        }
       
    </script>
</body>
</html>
