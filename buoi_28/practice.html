<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let count = "";
        for (let i = 0; i <= 7; i++) {
            for (let j = 0; j <= i ;j++) {
                count = count + "#";
                // Sau mỗi lần lặp số thăng được tăng lên một
            }
            console.log(count)
            // In ra các dấu thăng
            count = ""
            // set count trở lại giá trị rỗng ban đầu
        }
    </script>
</body>
</html>
