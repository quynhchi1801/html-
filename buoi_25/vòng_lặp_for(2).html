<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let N = 77;
        let A = 17;
        let B = 25;
        let result = 0;
        let temp = 0;
        for (let i = 1; i <= parseInt(N/A); i++){
            for (let j = 1; j <= parseInt(N/A); j ++){
                temp = A*j+B*i
                if ((result < temp) && (temp <= N)){
                    result = temp;
                } 
            }
        }
        console.log(result)
    </script>
</body>
</html>
